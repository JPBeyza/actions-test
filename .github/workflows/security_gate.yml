name: Security Gate

on: [push]

jobs:
  gatekeeper:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check for forbidden files
        run: |
          echo "Scanning for forbidden files..."
          if [ -f passwords.txt ] || [ -f id_rsa ]; then
            echo "::error::Forbidden sensitive file detected! Blocking pipeline."
            exit 1
          else
            echo "Security check passed. No forbidden files found."
            exit 0
          fi
